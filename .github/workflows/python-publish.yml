name: Upload Python Package

# Runs when you publish a GitHub Release (for example v0.4.0).
# One-time PyPI setup (trusted publishing, no token needed):
#   https://pypi.org/manage/account/publishing/  ->  "Add a new pending publisher"
#     PyPI project name: daneq   Owner: fourzerosix   Repository: DanEQ
#     Workflow name: python-publish.yml   Environment name: pypi
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test before publishing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,audio]"
      - run: pytest -q
      - run: daneq --selftest

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          PKG="$(python -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("daneq/__init__.py").read()).group(1))')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package version: $PKG   release tag: $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match daneq/__init__.py version $PKG. Bump the version, then re-create the release."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/daneq/
    permissions:
      id-token: write     # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    name: Attach wheel and sdist to the GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
