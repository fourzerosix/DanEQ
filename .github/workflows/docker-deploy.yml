name: Publish Docker Image

# Runs when you publish a GitHub Release. Publishes a multi-arch image (amd64 + arm64) to
#   Docker Hub : fourzerosix/daneq   (needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN)
#   GHCR       : ghcr.io/fourzerosix/daneq   (no setup, uses the built-in GITHUB_TOKEN)
# If the Docker Hub secrets are missing, only GHCR is published.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: daneq

jobs:
  push_to_registry:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image names
        id: names
        run: |
          IMAGES="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          if [ -n "${DOCKERHUB_TOKEN}" ]; then
            IMAGES="${IMAGES}"$'\n'"${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          fi
          {
            echo "images<<EOF"
            echo "${IMAGES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          # v0.4.0 -> 0.4.0, 0.4, 0 and latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        if: env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/daneq
          short-description: "Terminal equalizer, effects rack and audio visualizer with a btop-style braille UI"
          readme-filepath: ./README.md
