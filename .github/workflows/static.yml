name: Deploy site to Pages

# Rebuilds https://fourzerosix.github.io/DanEQ/ whenever you publish a Release (or run it by hand).
# One-time setup:
#   1. repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. repo Settings -> Environments -> github-pages -> Deployment branches and tags:
#      add a TAG rule "v*" (release runs come from a tag, and the default rule only allows main)
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**", "README.md", "CHANGELOG.md", "assets/**", ".github/workflows/static.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build the site
        run: bash site/build.sh public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
