[metadata]
name = daneq
version = attr: daneq.__version__
description = A btop-style terminal equalizer, effects rack and audio visualizer
long_description = file: README.md
long_description_content_type = text/markdown
author = Jeremy Bell
license = GPL-3.0-only
license_files = LICENSE
url = https://github.com/fourzerosix/DanEQ
project_urls =
    Issues = https://github.com/fourzerosix/DanEQ/issues
keywords = equalizer, audio, spectrum, visualizer, terminal, tui, pulseaudio, pipewire, coreaudio
classifiers =
    Environment :: Console :: Curses
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: POSIX :: Linux
    Operating System :: MacOS :: MacOS X
    Programming Language :: Python :: 3
    Topic :: Multimedia :: Sound/Audio :: Analysis

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.21
    scipy>=1.7
    sounddevice>=0.4.4; sys_platform == "darwin"

[options.packages.find]
include = daneq*

[options.extras_require]
dev =
    pytest
    build
    twine
audio =
    soundfile
mac =
    sounddevice
    soundfile
all =
    sounddevice
    soundfile

[options.entry_points]
console_scripts =
    daneq = daneq.cli:main
